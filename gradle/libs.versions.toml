[versions]
# Platform versions remain provisional until their adapters are enabled and verified.
minecraft = "1.21.11"
paper-api = "1.21.11-R0.1-SNAPSHOT"
velocity-api = "3.5.1"
fabric-loom = "1.19.1"
fabric-loader = "0.20.0"
yarn = "1.21.11+build.6"

junit = "6.1.3"
assertj = "3.27.7"
snakeyaml = "2.7"
json-schema-validator = "3.0.8"
jackson = "3.2.3"
nimbus-jose-jwt = "10.10"
zstd-jni = "1.5.7-23"
sqlite-jdbc = "3.53.4.0"
hikari = "7.1.0"
postgresql = "42.7.14"
mysql-connector = "26.7.0"
mariadb-connector = "3.5.10"
testcontainers = "2.0.5"
postgresql-test-image = "17.11-alpine"
mysql-test-image = "8.4.10"
mariadb-test-image = "11.4.13"
spotless = "8.10.4"
# Matches Spotless's adapter; 1.37.0 breaks its style API.
google-java-format = "1.36.1"
ktfmt = "0.65"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
mariadb-connector = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-connector" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
